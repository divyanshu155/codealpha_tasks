{% extends 'base.html' %}

{% block title %}Sign In - SocialPulse{% endblock %}

{% block content %}
<div class="auth-box">
  <div class="card" style="padding:36px;">
    <h2 style="font-size:1.75rem;margin-bottom:8px;text-align:center;">Welcome Back</h2>
    <p style="color:var(--text-muted);text-align:center;margin-bottom:28px;">Log in to connect, post, and engage</p>

    <form method="POST">
      {% csrf_token %}
      {% for field in form %}
        <div style="margin-bottom:16px;">
          <label style="display:block;font-size:0.88rem;color:var(--text-muted);margin-bottom:6px;">{{ field.label }}</label>
          {{ field }}
        </div>
      {% endfor %}

      <button type="submit" class="btn btn-primary btn-block" style="padding:12px;margin-top:8px;">
        Sign In
      </button>
    </form>

    <p style="text-align:center;color:var(--text-muted);margin-top:24px;font-size:0.9rem;">
      Don't have an account? <a href="{% url 'register' %}" style="color:var(--primary);text-decoration:none;font-weight:600;">Register here</a>
    </p>
  </div>
</div>
{% endblock %}
