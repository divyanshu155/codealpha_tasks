{% extends 'base.html' %}

{% block title %}Edit Profile - SocialPulse{% endblock %}

{% block content %}
<div class="auth-box">
  <div class="card" style="padding:32px;">
    <h2 style="font-size:1.5rem;margin-bottom:20px;">Edit Profile</h2>
    <form method="POST">
      {% csrf_token %}
      <div style="margin-bottom:16px;">
        <label style="display:block;font-size:0.9rem;color:var(--text-muted);margin-bottom:6px;">Location</label>
        <input type="text" name="location" class="form-control" value="{{ user.profile.location }}" placeholder="City, Country">
      </div>
      <div style="margin-bottom:20px;">
        <label style="display:block;font-size:0.9rem;color:var(--text-muted);margin-bottom:6px;">Bio</label>
        <textarea name="bio" class="create-post-textarea" placeholder="Tell the world about yourself..." style="min-height:100px;">{{ user.profile.bio }}</textarea>
      </div>
      <div style="display:flex;gap:12px;">
        <a href="{% url 'profile' %}" class="btn btn-secondary" style="flex:1;">Cancel</a>
        <button type="submit" class="btn btn-primary" style="flex:1.5;">Save Changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
